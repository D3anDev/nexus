<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dean Husain</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="site-container">
        <header class="main-header">
            <div class="brand">
                <span class="accent-text">D3AN.DEV</span>
            </div>

            <input type="checkbox" id="nav-toggle" class="nav-toggle">

            <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <nav class="main-nav">
                <a href="#summary">OVERVIEW</a>
                <a href="#education">EDUCATION</a>
                <a href="#skills">CAPABILITIES</a>
                <a href="#projects">PROJECTS</a>
                <a href="#experience">EXPERIENCE</a>
            </nav>
        </header>

        <main>
            <section id="summary" class="card hero-card">
                <div class="card-header">// OVERVIEW</div>
                <div class="card-body" id="summary-container">
                </div>
            </section>

            <section id="education" class="card">
                <div class="card-header">// EDUCATION</div>
                <div class="card-body" id="education-container">
                </div>
            </section>

            <section id="skills" class="card">
                <div class="card-header">// TECHNICAL_CAPABILITIES</div>
                <div class="card-body grid-2" id="skills-container">
                </div>
            </section>

            <section id="projects" class="card">
                <div class="card-header">// SYSTEMS_&_NETWORK_PROJECTS</div>
                <div class="card-body" id="projects-container">
                </div>
            </section>

            <section id="experience" class="card">
                <div class="card-header">// PROFESSIONAL_EXPERIENCE</div>
                <div class="card-body" id="experience-container">
                </div>
            </section>
        </main>

        <footer class="main-footer">
            <span>Website Developed using locally hosted AI Assistance</span>
            <span></span>
        </footer>
    </div>
</body>

</html>
